name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=knowledge_aug_lab --cov-report=term-missing
      - name: CLI smoke test
        run: kal showcase > /dev/null && kal catalog --json > /dev/null
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
