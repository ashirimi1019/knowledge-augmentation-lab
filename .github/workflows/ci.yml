name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development environment
        run: |
          python -m pip install --require-hashes -r constraints/build.txt
          python -m pip install --require-hashes -r constraints/py313.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Strict type check
        run: pyright
      - name: Test with branch coverage
        run: pytest --cov=knowledge_aug_lab --cov-branch --cov-report=term-missing

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            constraints: constraints/py310.txt
          - python-version: "3.11"
            constraints: constraints/py311.txt
          - python-version: "3.12"
            constraints: constraints/py312.txt
          - python-version: "3.13"
            constraints: constraints/py313.txt
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development environment
        run: |
          python -m pip install --require-hashes -r constraints/build.txt
          python -m pip install --require-hashes -r ${{ matrix.constraints }}
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Test
        run: pytest
      - name: Smoke-test CLI
        run: kal showcase > /dev/null && kal catalog --json > /dev/null

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tooling
        run: |
          python -m pip install --require-hashes -r constraints/build.txt
          python -m pip install --require-hashes -r constraints/py313.txt
      - name: Build wheel and source distribution
        run: python -m build --no-isolation
      - name: Validate distributions
        run: python -m twine check --strict dist/*
      - name: Install and smoke-test wheel
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --no-deps dist/*.whl
          .venv-wheel/bin/kal catalog --json > /dev/null
      - name: Install and smoke-test source distribution
        run: |
          python -m venv .venv-sdist
          .venv-sdist/bin/python -m pip install --require-hashes -r constraints/build.txt
          .venv-sdist/bin/python -m pip install --no-build-isolation --no-deps dist/*.tar.gz
          .venv-sdist/bin/kal showcase > /dev/null
