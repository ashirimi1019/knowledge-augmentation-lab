[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-augmentation-lab"
version = "0.1.0"
description = "Runnable, dependency-light demonstrations of modern knowledge-augmentation patterns for LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Ashir Imran"}]
dependencies = []

[project.optional-dependencies]
app = ["streamlit>=1.36", "pandas>=2.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
kal = "knowledge_aug_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
