[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-augmentation-lab"
version = "0.1.0"
description = "Runnable, dependency-light demonstrations of modern knowledge-augmentation patterns for LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Ashir Imran"}]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
app = ["streamlit>=1.36", "pandas>=2.0"]
dev = [
    "build>=1.2",
    "hypothesis>=6.112",
    "pyright>=1.1.390",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "twine>=6.2,<7",
]

[project.scripts]
kal = "knowledge_aug_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["knowledge_aug_lab"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
reportUnnecessaryIsInstance = false
